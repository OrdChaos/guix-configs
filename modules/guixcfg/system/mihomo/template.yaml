# Mihomo base config template（repository authority，docs/architecture/mihomo.md）。
#
# 两个占位符由 mihomo-config materializer 在 boot 时替换：订阅 URL
# （secret）与 NetworkManager dnsmasq 的稳定 UID。合成结果写入
# /run/mihomo/config.yaml（root 0600）经 -f 交给 Mihomo。
# 本模板【不可直接运行】——占位符不是合法值（materializer 的 fail-closed
# 契约：每个占位符必须恰好出现一次，缺失/重复即失败；因此本注释不写出
# 占位符字面量）。
#
# DNS 所有权（docs/architecture/dns.md）：
#   TUN off：应用 → 系统 resolver（/etc/resolv.conf 127.0.0.1）→
#            NetworkManager dnsmasq → DHCP DNS。
#   TUN on ：mihomo 接管 DNS（fake-ip + dns-hijack）；DIRECT/local 经
#            `direct-nameserver: system` 回到 dnsmasq → DHCP DNS；代理侧
#            经 DoH。NetworkManager dnsmasq 的上游以专用 UID 运行并被
#            `tun.exclude-uid` 排除，切断递归。
# self-update 关闭（binary 归 Guix）；controller 仅 loopback（secret
# 置空是单用户 loopback-only 部署的明确选择）。

mode: rule
log-level: info
# IPv6 关闭：机场节点全部是 v4（trojan），TUN 捕获 v6 流量映射给
# 节点后节点自身无 v6、连不上目标 v6 地址（bordeaux/github AAAA
# 秒断——VM 实测 "curl -6 bordeaux" 000/0.000s 而 -4 正常）。
# 关闭后系统 v6 流量走原生路径绕过 Mihomo（v4-only 机场的取舍）。
ipv6: false
external-controller: 127.0.0.1:9090
secret: ""
dns:
  enable: true
  ipv6: false
  # 仅供 mihomo 内部/hijack 使用；127.0.0.1:53 归 NetworkManager
  # dnsmasq，这里用另一个端口避免冲突。
  listen: "127.0.0.1:1053"
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "+.local"
    - "localhost.ptlogin2.qq.com"
  # DoH 服务器域名的 bootstrap（必须是 IP，仅用于解析 nameserver /
  # proxy-server-nameserver 的域名；不承担普通系统解析）。
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # DIRECT / local 流量解析经系统 resolver：/etc/resolv.conf（127.0.0.1）
  # → NetworkManager dnsmasq → DHCP DNS（含 captive portal）。
  direct-nameserver:
    - system
  # 代理侧可靠 DNS（DoH）。
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  # 代理节点域名的 bootstrap DNS（拨号节点前解析节点域名）。
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
sniffer:
  enable: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
    QUIC:
      ports: [443, 8443]
tun:
  enable: true
  stack: mixed
  device: mihomo0
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  # NetworkManager dnsmasq 的专用稳定 UID：其上游 DHCP DNS 查询必须
  # 绕过 TUN（否则进入 dns-hijack → mihomo DNS → 递归）。UID 由
  # (guixcfg system dns nm-dnsmasq) 单一拥有。
  exclude-uid:
    - @@MIHOMO_NM_DNSMASQ_UID@@
proxy-providers:
  airport:
    type: http
    url: "@@MIHOMO_SUBSCRIPTION_URL@@"
    path: ./providers/airport.yaml
    interval: 3600
    # 订阅刷新直连（proxy: DIRECT）：不依赖代理组/节点可用性——节点
    # 全挂时刷新照常。节点/订阅域名经 mihomo `proxy-server-nameserver`
    # 解析；宿主直连出站可信（实测直连拉取成功，updatedAt 更新；早前
    # EOF 是宿主侧残留 clash 所致）。
    proxy: DIRECT
    health-check:
      enable: true
      interval: 600
      lazy: true
      url: https://www.gstatic.com/generate_204
proxy-groups:
  - name: PROXY
    type: select
    use: [airport]
rules:
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - MATCH,PROXY
