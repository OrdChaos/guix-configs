# Mihomo Phase 1 base config template（repository authority，
# docs/architecture/mihomo.md）。
#
# subscription URL 占位符由 mihomo-config materializer 在 boot 时替换，
# 合成结果写入 /run/mihomo/config.yaml（root 0600）经 -f 交给 Mihomo。
# 本模板【不可直接运行】——占位符不是合法 URL（materializer 的
# fail-closed 契约：占位符必须恰好出现一次，缺失/重复即失败）。
#
# Phase 1 边界：不接管 DNS（无 dns 段、dns-hijack 显式置空）、
# 不启用 fake-ip、不启用 self-update（binary 归 Guix）、controller
# 仅 loopback（secret 置空是单用户 loopback-only 部署的明确选择）。

mode: rule
log-level: info
# IPv6 关闭：机场节点全部是 v4（trojan），TUN 捕获 v6 流量映射给
# 节点后节点自身无 v6、连不上目标 v6 地址（bordeaux/github AAAA
# 秒断——VM 实测 "curl -6 bordeaux" 000/0.000s 而 -4 正常）。
# 关闭后系统 v6 流量走原生路径绕过 Mihomo（v4-only 机场的取舍）。
ipv6: false
external-controller: 127.0.0.1:9090
secret: ""
tun:
  enable: true
  stack: mixed
  device: mihomo0
  dns-hijack: []
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
proxy-providers:
  airport:
    type: http
    url: "@@MIHOMO_SUBSCRIPTION_URL@@"
    path: ./providers/airport.yaml
    interval: 3600
    # 订阅刷新直连（proxy: DIRECT）：不依赖代理组/节点可用性——节点
    # 全挂时刷新照常。可直连的前提：节点域名解析经 SmartDNS 直连
    # 上游（见 rules 段的自举注释），且宿主直连出站可信（实测
    # api.wd-purple.com 直连拉取成功，updatedAt 更新；早前 EOF 是
    # 宿主侧残留 clash 所致，已恢复）。
    proxy: DIRECT
    health-check:
      enable: true
      interval: 600
      lazy: true
      url: https://www.gstatic.com/generate_204
proxy-groups:
  - name: PROXY
    type: select
    use: [airport]
rules:
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  # SmartDNS 上游（223.5.5.5/119.29.29.29）必须 DIRECT——这是自举
  # 必需：机场节点服务器是域名（oss-cn-*.toshiba-nvme.com），mihomo
  # 拨号节点前要先经系统 DNS（SmartDNS）解析它；若上游查询走
  # MATCH→PROXY（经节点），解析节点域名又需要节点本身——死锁，
  # 全部节点 SERVFAIL/timeout（2026-08-28 重启后实测：all proxies
  # timeout）。直连上游还附带 DNS 不随节点存亡（TUN off 时退化为
  # 直连机器，见 docs/architecture/network.md §7）。
  - IP-CIDR,223.5.5.5/32,DIRECT,no-resolve
  - IP-CIDR,119.29.29.29/32,DIRECT,no-resolve
  - MATCH,PROXY
