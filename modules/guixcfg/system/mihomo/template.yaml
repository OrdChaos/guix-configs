# Mihomo base config template（repository authority，docs/architecture/mihomo.md）。
#
# 四个占位符由 mihomo-config materializer 在 boot 时替换：生成的
# provider 块、group 块、NetworkManager dnsmasq 的稳定 UID，以及
# SmartDNS 的稳定 UID。
# 源清单与每个源的 age 文件在 (guixcfg system mihomo sources) 中声明；
# materializer 读取各源明文后生成 provider/group 块。
# 合成结果写入 /run/mihomo/config.yaml（root 0600）经 -f 交给 Mihomo。
# 本模板【不可直接运行】——占位符不是合法值（materializer 的 fail-closed
# 契约：每个占位符必须恰好出现一次，缺失/重复即失败；因此本注释不写出
# 占位符字面量）。
#
# DNS 已与 mihomo 解耦（docs/architecture/dns.md）：
#   应用 → /etc/resolv.conf 127.0.0.1:53（SmartDNS）。
#   fixed 模式只查 AliDNS IP DoH；dhcp 模式只查 NM dnsmasq。
#   mihomo 不再监听 53、不解析 DNS、不劫持 DNS；TUN 只承载业务流量。
#   两个 resolver 上游 UID 都在 tun.exclude-uid 中，避免 DNS → TUN
#   的递归或 DNS 对 mihomo 的依赖。
# self-update 关闭（binary 归 Guix）；controller 仅 loopback（secret
# 置空是单用户 loopback-only 部署的明确选择）。

mode: rule
log-level: info
# IPv6 关闭：机场节点全部是 v4（trojan），TUN 捕获 v6 流量映射给
# 节点后节点自身无 v6、连不上目标 v6 地址（bordeaux/github AAAA
# 秒断——VM 实测 "curl -6 bordeaux" 000/0.000s 而 -4 正常）。
# 关闭后系统 v6 流量走原生路径绕过 Mihomo（v4-only 机场的取舍）。
ipv6: false
external-controller: 127.0.0.1:9090
secret: ""
sniffer:
  enable: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
    QUIC:
      ports: [443, 8443]
tun:
  enable: true
  stack: mixed
  device: mihomo0
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  # SmartDNS 与 NetworkManager dnsmasq 的上游必须绕过 TUN：
  # DNS 现在独立于 mihomo，不能被 TUN 捕获，否则会重新依赖代理进程。
  # UID 由 (guixcfg system dns smartdns) 与
  # (guixcfg system dns nm-dnsmasq) 单一拥有。
  exclude-uid:
    - @@MIHOMO_NM_DNSMASQ_UID@@
    - @@MIHOMO_SMARTDNS_UID@@
# 国内直连 / 国外代理。Loyalsoldier/clash-rules 的 release 分支每天由
# CI 重新生成（当前约 29k stars）；payload 是 Clash domain 规则。
# 文件放在 -d 根目录，避免额外创建 rules/ 子目录。
rule-providers:
  loyalsoldier-proxy:
    type: http
    behavior: domain
    format: yaml
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/proxy.txt
    path: ./loyalsoldier-proxy.yaml
    interval: 86400
  loyalsoldier-direct:
    type: http
    behavior: domain
    format: yaml
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt
    path: ./loyalsoldier-direct.yaml
    interval: 86400
  cn-ip:
    type: http
    behavior: ipcidr
    format: text
    url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/text/cn.txt
    path: ./cncidr.txt
    interval: 86400
# 订阅源由 (guixcfg system mihomo sources) 的 %mihomo-sources 声明，
# 每源一个 age 文件；materializer 读取单 URL/provider YAML 后生成：
#   kuromis (http) → provider-kuromis + 组 kuromis
#   edge (file)    → provider-edge + 组 edge
# 顶层 PROXY 选择这些 <name> 子组；文件源必须是 mihomo provider YAML。
proxy-providers:
@@MIHOMO_PROXY_PROVIDERS@@
proxy-groups:
@@MIHOMO_PROXY_GROUPS@@
rules:
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  # 国内目标 IP 直连：游戏服务器等没有域名命中的流量不落到 MATCH,PROXY。
  - RULE-SET,cn-ip,DIRECT,no-resolve
  # proxy 在 direct 之前：两表重叠时优先走代理。
  - RULE-SET,loyalsoldier-proxy,PROXY
  - RULE-SET,loyalsoldier-direct,DIRECT
  - MATCH,PROXY
