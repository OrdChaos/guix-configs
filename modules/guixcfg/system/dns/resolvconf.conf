# openresolv 配置（repo authority，docs/architecture/dns.md）。
# libc subscriber 的输出重定向到 /run——DHCP DNS 由 NM 经
# resolvconf -a 记录，只产出 /run upstream metadata，不再写
# /etc/resolv.conf（该文件归 (guixcfg system dns ownership) 静态
# 声明）。其余 subscriber（named/dnsmasq/unbound 等）显式关闭：
# openresolv 3.17.4 的 -u 会运行 LIBEXECDIR 下全部 subscriber
# （store 实测 sbin/resolvconf:1488），script_var 由文件名派生
# （systemd-resolved → systemd_resolved_enabled）。
resolv_conf=/run/resolvconf/resolv.conf
dnsmasq_enabled=NO
named_enabled=NO
pdnsd_enabled=NO
pdns_recursor_enabled=NO
resolvectl_enabled=NO
systemd_resolved_enabled=NO
unbound_enabled=NO
