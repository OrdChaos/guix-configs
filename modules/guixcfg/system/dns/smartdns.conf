# SmartDNS Phase 2 v1 配置（repo authority，docs/architecture/dns.md）。
# 只监听 loopback（smartdns 默认绑定所有接口，必须显式收紧）；
# 固定 IP literal upstream（无 hostname bootstrap；
# mihomo 侧有对应 DIRECT 规则）；cache 仅内存；不做测速/分流。
bind 127.0.0.1:53
bind-tcp 127.0.0.1:53
bind [::1]:53
bind-tcp [::1]:53
cache-size 8192
prefetch-domain yes
serve-expired yes
log-level info
server 223.5.5.5
server 119.29.29.29
