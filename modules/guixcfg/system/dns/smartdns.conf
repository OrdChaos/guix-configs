# SmartDNS Phase 2 v1 配置（repo authority，docs/architecture/dns.md）。
# 只监听 loopback（smartdns 默认绑定所有接口，必须显式收紧）；
# 固定 IP literal upstream（无 hostname bootstrap；查询直连——
# mihomo 模板含上游 DIRECT 规则，自举必需：节点服务器是域名，
# 上游走节点 = 解析死锁）；cache 仅内存；不做测速/分流。
# 刻意不绑 [::1]：系统 resolver 是 v4-literal（/etc/resolv.conf 只有
# nameserver 127.0.0.1），[::1] 无消费者；绑定它会让整个 DNS 服务在
# IPv6 被禁用时启动失败（2026-08-28 VM 实测）。
bind 127.0.0.1:53
bind-tcp 127.0.0.1:53
cache-size 8192
prefetch-domain yes
serve-expired yes
log-level info
server 223.5.5.5
server 119.29.29.29
