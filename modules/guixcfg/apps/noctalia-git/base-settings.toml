# Noctalia 初始配置 seed（repository authority，seed-once 模型）。
#
# 语义（docs/architecture/persistence.md（seed-once））：
#   - 本文件只在 ~/.local/state/noctalia/settings.toml 从未存在时被
#     首次写入（system activation，原子落盘 + marker 记录）；
#   - 写入后 repository 永久放弃该文件 ownership——文件完全由
#     Noctalia/用户运行时管理；后续 reconfigure 绝不覆盖/同步/修正
#     （包括本 seed 本身的更新）；
#   - seed-once != declarative management：不要把它改写成"每次同步
#     默认配置"。
#
# 键名依据 pinned Noctalia example.toml / config schema
# （settings.toml 是 overrides 格式，与 declarative config 同 schema）。
# 未列出的项保持 Noctalia 内置默认值。
#
# 可移植性规则：seed 不得含用户绝对路径（用 ~/）、机器专属输出
# （显示器名等）、运行时产生的状态（wallpaper.last、widget 实例
# ID）——它不是任何一台机器 live settings.toml 的快照。

# 当前 schema config version（pinned source
# src/config/config_migrations.cpp：kPluginAutoUpdateModeMigrationVersion
# = 13）：避免首启时 Noctalia 对无版本 overrides 表执行迁移回写。
config_version = 13

[shell]
# Guix 负责完成首次初始化，Noctalia 不应再跑交互式 setup wizard
# 做第二轮初始化。.setup-complete 由 Noctalia 自己管理（不伪造），
# 随整个 state 目录持久化。
setup_wizard_enabled = false
telemetry_enabled = false
app_icon_color = "primary"
font_family = "Segoe UI"
avatar_path = "~/Pictures/avatar.png"
settings_show_advanced = false

[shell.screenshot]
save_to_file = true
copy_to_clipboard = true
freeze_screen = true
directory = "~/Pictures/Screenshots"

[shell.launcher]
categories = true
show_icons = true
sort_by_usage = false

[shell.panel]
open_near_click_control_center = true

[bar.default]
center = [ "clock", "weather" ]
concave_edge_corners = false
end = [ "tray", "notifications", "network", "bluetooth", "volume", "brightness", "battery", "session" ]
margin_edge = 6
margin_ends = 6
padding = 4
radius = 16
shadow = false
start = [ "launcher", "taskbar" ]
thickness = 40

[control_center]
sidebar = "none"
sidebar_section = "none"

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "dark_mode"

    [[control_center.shortcuts]]
    type = "power_profile"

[location]
auto_locate = false
address = "Wuhan,China"

[lockscreen]
enabled = true

[osd]
position = "top_right"
position_vertical = "top_right"

[system.monitor]
enabled = false

[theme]
mode = "light"
source = "custom"
custom_palette = "fluent-blue"
wallpaper_scheme = "m3-fruit-salad"

[theme.templates]
builtin_ids = [ "gtk3", "gtk4", "ghostty", "kcolorscheme", "niri", "qt", "starship" ]
community_ids = [ "obsidian", "vscode", "discord", "obs", "steam", "telegram" ]

[wallpaper]
enabled = true
fill_mode = "crop"
directory = "~/Pictures/Wallpapers"

[widget.battery]
capsule = true

[widget.bluetooth]
capsule = true

[widget.brightness]
capsule = true

[widget.control-center]
capsule = true

[widget.launcher]
capsule = true

[widget.network]
capsule = true
show_label = false

[widget.notifications]
capsule = true

[widget.session]
capsule = true

[widget.taskbar]
group_by_workspace = true
show_all_outputs = true

[widget.tray]
capsule = true
drawer = true
drawer_columns = 5
match_adjacent_spacing = true
pinned = [ "fcitx5" ]

[widget.volume]
capsule = true
