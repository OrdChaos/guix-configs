# classicui：候选窗外观（repo-owned，不持久化）。
#
# FluentLight / FluentLight-solid 由 Virelith fcitx5-fluentlight-theme
# 提供（share/fcitx5/themes/，经 home profile 的 XDG_DATA_DIRS 发现）。
# niri 不是 KWin、无 BlurEffect，浅深都选 solid 变体并跟随系统
# 浅色/深色（UseDarkTheme）。
#
# 字体用 fontconfig generic alias "Sans Serif"——解析走仓库
# fontconfig fallback 策略（(guixcfg home fonts)），不写死具体
# 字体族。EnableFractionalScale：niri 分数缩放下候选窗不糊。
Font="Sans Serif 12"
MenuFont="Sans Serif 12"
TrayFont="Sans Serif Bold 12"
Theme=FluentLight-solid
DarkTheme=FluentLight-solid
UseDarkTheme=True
EnableFractionalScale=True
