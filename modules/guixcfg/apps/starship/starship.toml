flamingo  = "#c95b65"
pink      = "#7c75ad"
mauve     = "#665f96"
maroon    = "#c95b65"
peach     = "#9c7429"
teal      = "#327c8f"
sky       = "#4a98a9"
sapphire  = "#5795c1"
