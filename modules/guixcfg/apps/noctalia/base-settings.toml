config_version = 13

[bar.default]
center = [ "clock", "weather" ]
concave_edge_corners = false
end = [ "tray", "notifications", "widget", "network", "bluetooth", "volume", "brightness", "battery", "session" ]
margin_edge = 6
margin_ends = 6
padding = 4
radius = 16
shadow = false
start = [ "launcher", "taskbar" ]
thickness = 40

[control_center]
sidebar = "none"
sidebar_section = "none"

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "dark_mode"

    [[control_center.shortcuts]]
    type = "power_profile"

[location]
address = "Wuhan,China"
auto_locate = false

[lockscreen]
enabled = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@Virtual-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 907.00006103515625
    cy = 871.0
    output = "Virtual-1"
    placement_height = 1053.0
    placement_width = 1813.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
enable_daemon = true

[osd]
position = "top_right"
position_vertical = "top_right"

[plugin_settings."mdj2812/mihomo-control"]
panel_placement = "attached"

[plugins]
enabled = [ "mdj2812/mihomo-control" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/ordchaos/custom-noctalia-plugins"
    name = "custom-plugins"

[shell]
app_icon_color = "primary"
avatar_path = "/home/ordchaos/.local/share/avatars/avatar.png"
settings_show_advanced = false
setup_wizard_enabled = false
telemetry_enabled = false

    [shell.launcher]
    categories = true
    show_icons = true
    sort_by_usage = false

    [shell.panel]
    open_near_click_control_center = true

    [shell.screenshot]
    copy_to_clipboard = true
    directory = "~/Pictures/Screenshots"
    freeze_screen = true
    save_to_file = true

[system.monitor]
enabled = false

[theme]
builtin = "Noctalia"
custom_palette = "fluent-blue"
mode = "light"
source = "custom"
wallpaper_scheme = "m3-fruit-salad"

    [theme.templates]
    builtin_ids = [ "ghostty", "kcolorscheme", "niri", "qt", "starship" ]
    community_ids = [ "obsidian", "vscode", "discord", "obs", "steam", "telegram" ]

        [theme.templates.user.gtk3]
        input_path = "$XDG_CONFIG_HOME/noctalia/templates/gtk3.css"
        output_path = "$XDG_CONFIG_HOME/gtk-3.0/noctalia.css"
        post_hook = "appearance-sync {{ mode }}"

        [theme.templates.user.gtk4]
        input_path = "$XDG_CONFIG_HOME/noctalia/templates/gtk4.css"
        output_path = "$XDG_CONFIG_HOME/gtk-4.0/noctalia.css"
        post_hook = "appearance-sync {{ mode }}"

[wallpaper]
directory = "/home/ordchaos/.local/share/backgrounds"
enabled = true
fill_mode = "crop"

    [wallpaper.default]
    path = "/home/ordchaos/.local/share/backgrounds/wallpaper.jpg"

    [wallpaper.last]
    path = "/home/ordchaos/.local/share/backgrounds/wallpaper.jpg"

    [wallpaper.monitors.Virtual-1]
    path = "/home/ordchaos/.local/share/backgrounds/wallpaper.jpg"

[widget.battery]
capsule = true

[widget.bluetooth]
capsule = true

[widget.brightness]
capsule = true

[widget.control-center]
capsule = true

[widget.launcher]
capsule = true

[widget.network]
capsule = true
show_label = false

[widget.notifications]
capsule = true

[widget.session]
capsule = true

[widget.taskbar]
group_by_workspace = true
show_all_outputs = true

[widget.tray]
capsule = true
drawer = true
drawer_columns = 5
match_adjacent_spacing = true
pinned = [ "fcitx5" ]

[widget.volume]
capsule = true

[widget.widget]
capsule = true
type = "mdj2812/mihomo-control:widget"