# Declarative GnuPG configuration — owned by the guixcfg gnupg
# application. The session service copies this file into the ephemeral
# GNUPGHOME (store symlinks are not usable there: gpg requires homedir
# files owned by the current user); edit the repository, not the copy.
#
# auto-key-retrieve: with a runtime-only keyring the web-of-trust /
# TOFU state is rebuilt on every session, so verification of other
# people's signatures fetches their public keys on demand.
keyserver hkps://keys.openpgp.org
auto-key-retrieve

# The secret key is passphrase-protected; the agent caches it for the
# session. With an ephemeral GNUPGHOME the cache dies with the
# session, so generous TTLs mean at most one pinentry prompt per
# session (single-user machine).
default-cache-ttl 3600
max-cache-ttl 86400
