# niri portal backend policy — repository-owned (apps/niri/definition.scm).
# Baseline = Niri upstream niri-portals.conf (default=gnome;gtk;,
# Access/Notification via gtk, Secret via gnome-keyring).
#
# FileChooser 刻意不覆盖、走默认 gnome 链：xdg-desktop-portal-gnome
# 把 FileChooser 委托给 Nautilus（50.0 实测：delegate 代理指向
# org.gnome.Nautilus，对话框由 nautilus-portal.c 在 present 之前
# 设置 xdg-foreign 父窗口 → niri 按浮窗处理，尺寸正常）。此前
# 被迫改 FileChooser=gtk 的 loupe "no interface on object"
# （2026-08-26 febdfdf）根因是会话环境 XDG_SESSION_TYPE=tty：
# greetd source_profile=true 使 ~/.profile（on-first-login →
# Home Shepherd → 会话 dbus）在官方 wrapper 设置 wayland 之前运行，
# 后端 gxdp_init_gtk 遇 tty 即 settings-only。根因已在系统层修复
# （apps/../system/desktop.scm：source-profile? #f）——dbus 激活
# 服务继承 wayland 后，gnome 后端完整导出 FileChooser（VM 实测），
# 无需 gtk 覆盖；gtk 后端的 GTK3 对话框父窗口设置晚于映射，niri
# 26.04 初始分类时看不到父窗口 → 平铺成整列（"打开文件浮窗和普通
# 窗口一样大"）。保留本文件以固定 niri upstream 基线其余部分。
#
# ScreenCast/Screenshot stay on gnome via the default chain.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
