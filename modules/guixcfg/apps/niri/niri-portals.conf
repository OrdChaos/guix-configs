# niri portal backend policy — repository-owned (apps/niri/definition.scm).
# Baseline = Niri upstream niri-portals.conf (default=gnome;gtk;,
# Access/Notification via gtk, Secret via gnome-keyring); only
# FileChooser is overridden to gtk: the gnome backend degrades to
# settings-only on non-GNOME desktops (XDG_CURRENT_DESKTOP=niri), yet
# its .portal FileChooser declaration blocks the portal frontend's
# last-resort gtk fallback (2026-08-26: loupe "no interface on object").
# ScreenCast/Screenshot stay on gnome via the default chain.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.FileChooser=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
